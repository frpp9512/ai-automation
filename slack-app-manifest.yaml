display_information:
  name: AI Automations Triage
  description: Routes Slack DMs and mentions through an AI triage pipeline
  background_color: "#4A154B"
features:
  bot_user:
    display_name: ai-automations-triage
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - users:read
      - im:history
      - channels:history
      - groups:history
      - mpim:history
    user:
      - search:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - usergroups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
